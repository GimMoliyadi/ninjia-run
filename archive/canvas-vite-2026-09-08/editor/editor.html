<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水墨忍者 - 关卡编辑器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "SimHei", sans-serif;
      background: #1a1a1a;
      color: #f2ecd9;
      overflow: hidden;
    }

    /* 顶部工具栏 */
    .toolbar {
      height: 50px;
      background: #2a2a2a;
      border-bottom: 2px solid #3a3a3a;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 10px;
    }

    .toolbar button {
      padding: 8px 16px;
      background: #3a3a3a;
      border: 1px solid #4a4a4a;
      color: #f2ecd9;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .toolbar button:hover {
      background: #4a4a4a;
      border-color: #5a5a5a;
    }

    .toolbar button:active {
      background: #2a2a2a;
    }

    .toolbar .separator {
      width: 1px;
      height: 30px;
      background: #3a3a3a;
      margin: 0 5px;
    }

    .segment-name {
      width: 220px;
      margin-left: auto;
      padding: 6px 8px;
      background: #1f1f1f;
      border: 1px solid #4a4a4a;
      border-radius: 4px;
      color: #d8a441;
      font-weight: bold;
      font-size: 14px;
    }

    /* 主内容区 */
    .main-content {
      display: flex;
      height: calc(100vh - 50px - 150px);
    }

    /* 左侧面板 */
    .left-panel {
      width: 200px;
      background: #252525;
      border-right: 2px solid #3a3a3a;
      overflow-y: auto;
      padding: 10px;
    }

    .panel-section {
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #d8a441;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid #3a3a3a;
    }

    .obstacle-item {
      padding: 10px;
      margin-bottom: 8px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .obstacle-item:hover {
      background: #3a3a3a;
      border-color: #4a4a4a;
    }

    .obstacle-item:active {
      cursor: grabbing;
    }

    .obstacle-icon {
      font-size: 20px;
    }

    .obstacle-name {
      font-size: 12px;
    }

    /* 画布区域 */
    .canvas-area {
      flex: 1;
      background: #1a1a1a;
      position: relative;
      overflow: hidden;
    }

    #editorCanvas {
      display: block;
      cursor: move;
    }

    .canvas-info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(42, 42, 42, 0.9);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #f2ecd9;
      pointer-events: none;
    }

    /* 底部属性面板 */
    .bottom-panel {
      height: 150px;
      background: #252525;
      border-top: 2px solid #3a3a3a;
      padding: 15px;
      overflow-y: auto;
    }

    .properties-title {
      font-size: 14px;
      font-weight: bold;
      color: #d8a441;
      margin-bottom: 10px;
    }

    .property-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      gap: 10px;
    }

    .property-label {
      width: 80px;
      font-size: 12px;
      color: #999;
    }

    .property-input {
      flex: 1;
      padding: 4px 8px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #f2ecd9;
      font-size: 12px;
      border-radius: 3px;
    }

    .property-input:focus {
      outline: none;
      border-color: #4a8b9e;
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a4a;
    }
  </style>
</head>
<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <button id="btnSave">💾 保存</button>
    <button id="btnLoad">📂 加载</button>
    <button id="btnUndo" title="撤销 (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="重做 (Ctrl+Y)">↷</button>
    <button id="btnGenerate">🎲 生成</button>
    <button id="btnTest">▶️ 测试</button>
    <button id="btnClear">🗑️ 清空</button>
    <div class="separator"></div>
    <button id="btnGrid">⊞ 网格</button>
    <button id="btnPlayerTool">🥷 人物工具</button>
    <input id="segmentName" class="segment-name" type="text" value="新建关卡段落" aria-label="关卡名称">
  </div>

  <!-- 主内容区 -->
  <div class="main-content">
    <!-- 左侧障碍物面板 -->
    <div class="left-panel">
      <div class="panel-section">
        <div class="panel-title">静态障碍物</div>
        <div class="obstacle-item" data-kind="spike">
          <span class="obstacle-icon">🔺</span>
          <span class="obstacle-name">尖刺</span>
        </div>
        <div class="obstacle-item" data-kind="pillar">
          <span class="obstacle-icon">▮</span>
          <span class="obstacle-name">石柱</span>
        </div>
        <div class="obstacle-item" data-kind="beam">
          <span class="obstacle-icon">▌</span>
          <span class="obstacle-name">垂板</span>
        </div>
        <div class="obstacle-item" data-kind="rock">
          <span class="obstacle-icon">⬟</span>
          <span class="obstacle-name">落石</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">动态障碍物</div>
        <div class="obstacle-item" data-kind="dart_wave">
          <span class="obstacle-icon">➤➤➤</span>
          <span class="obstacle-name">飞镖组</span>
        </div>
        <div class="obstacle-item" data-kind="boulder">
          <span class="obstacle-icon">⚫</span>
          <span class="obstacle-name">滚石</span>
        </div>
        <div class="obstacle-item" data-kind="ninja">
          <span class="obstacle-icon">🥷</span>
          <span class="obstacle-name">剑忍</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-title">收集物</div>
        <div class="obstacle-item" data-kind="coin">
          <span class="obstacle-icon">🪙</span>
          <span class="obstacle-name">金币</span>
        </div>
        <div class="obstacle-item" data-kind="scroll">
          <span class="obstacle-icon">📜</span>
          <span class="obstacle-name">卷轴</span>
        </div>
        <div class="obstacle-item" data-kind="shield">
          <span class="obstacle-icon">🛡️</span>
          <span class="obstacle-name">护盾</span>
        </div>
      </div>
    </div>

    <!-- 画布区域 -->
    <div class="canvas-area">
      <canvas id="editorCanvas"></canvas>
      <div class="canvas-info">
        <div>滚动位置: <span id="infoScroll">0</span> px</div>
        <div>鼠标位置: <span id="infoMouse">-</span></div>
        <div>已选对象: <span id="infoSelected">0</span></div>
      </div>
    </div>
  </div>

  <!-- 底部属性面板 -->
  <div class="bottom-panel">
    <div class="properties-title">属性编辑</div>
    <div id="propertiesContent">
      <p style="color: #666; font-size: 12px;">未选中任何对象</p>
    </div>
  </div>

  <script type="module" src="./editor.js"></script>
</body>
</html>
